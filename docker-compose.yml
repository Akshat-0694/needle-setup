services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000

  scheduler:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    command: python -m app.scheduler
