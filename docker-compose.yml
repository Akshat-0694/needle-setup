services:
  app:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - "./data:/app/data"
      - "needle-cache:/root/.cache/cactus-needle"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on: [mcp]

  mcp:
    build: .
    command: ["python", "-m", "app.mcp.server"]
    env_file: .env
    volumes: ["./data:/app/data"]
    restart: unless-stopped

  notion-mcp:
    image: mcp/notion:latest
    command:
      [
        "--transport",
        "http",
        "--host",
        "0.0.0.0",
        "--port",
        "3000",
        "--auth-token",
        "${NOTION_MCP_AUTH_TOKEN}",
      ]
    environment:
      NOTION_TOKEN: ${NOTION_TOKEN}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    volumes:
      - "./data:/app/data"
      - "needle-cache:/root/.cache/cactus-needle"
    restart: unless-stopped
    depends_on: [mcp]

  telegram:
    build: .
    command: ["python", "-m", "app.transports.telegram_poll"]
    env_file: .env
    volumes:
      - "./data:/app/data"
      - "needle-cache:/root/.cache/cactus-needle"
    restart: unless-stopped
    depends_on: [mcp]

volumes:
  needle-cache:
