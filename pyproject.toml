[project]
name = "needle-daily"
version = "0.1.0"
description = "A small always-on personal task system built around Cactus Needle 2."
requires-python = ">=3.10"
dependencies = [
  "cactus-needle>=2.0,<3",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "httpx>=0.28,<1",
  "apscheduler>=3.11,<4",
]
